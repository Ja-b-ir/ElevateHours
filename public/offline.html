<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0D7377" />
  <title>Offline — ElevateHours</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
           font-family: Inter, -apple-system, system-ui, sans-serif; background:#F8F9FC; color:#0C1024; padding:1.5rem; }
    img { width:84px; height:84px; border-radius:20px; margin-bottom:1.25rem; }
    h1 { font-size:1.5rem; margin:0 0 .5rem; }
    p { color:#4A5170; margin:0 0 1.5rem; line-height:1.6; }
    button { background:#0D7377; color:#fff; border:0; padding:.8rem 1.6rem; border-radius:12px; font-weight:700; font-size:.95rem; }
  </style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="ElevateHours" />
    <h1>You're offline</h1>
    <p>ElevateHours needs an internet connection.<br/>Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
